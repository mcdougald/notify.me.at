<svg xmlns="http://www.w3.org/2000/svg" width="880" height="232" viewBox="0 0 880 232" role="img" aria-label="How notify.me.at works: Publish, then Check, then Claim, then Limit, then Deliver">
<rect x="0.5" y="0.5" width="879" height="231" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
<rect x="24" y="24" width="144" height="145" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="40" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a3a3a3" opacity="1">01</text>
<text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0a0a0a" font-weight="600"><tspan x="40" dy="0">Publish</tspan></text>
<text x="40" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#525252"><tspan x="40" dy="0">POST a message</tspan><tspan x="40" dy="19">to a topic URL.</tspan></text>
<path d="M174 96.5 H188" stroke="#a3a3a3" stroke-width="1.5"/><path d="M184 92.5 L190 96.5 L184 100.5" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="196" y="24" width="144" height="145" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="212" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a3a3a3" opacity="1">02</text>
<text x="212" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0a0a0a" font-weight="600"><tspan x="212" dy="0">Check</tspan></text>
<text x="212" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#525252"><tspan x="212" dy="0">Write token and</tspan><tspan x="212" dy="19">rate limits</tspan><tspan x="212" dy="19">first.</tspan></text>
<path d="M346 96.5 H360" stroke="#a3a3a3" stroke-width="1.5"/><path d="M356 92.5 L362 96.5 L356 100.5" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="368" y="24" width="144" height="145" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="384" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a3a3a3" opacity="1">03</text>
<text x="384" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0a0a0a" font-weight="600"><tspan x="384" dy="0">Claim</tspan></text>
<text x="384" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#525252"><tspan x="384" dy="0">Each delivery</tspan><tspan x="384" dy="19">claimed once in</tspan><tspan x="384" dy="19">the database.</tspan></text>
<path d="M518 96.5 H532" stroke="#a3a3a3" stroke-width="1.5"/><path d="M528 92.5 L534 96.5 L528 100.5" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="540" y="24" width="144" height="145" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="556" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a3a3a3" opacity="1">04</text>
<text x="556" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0a0a0a" font-weight="600"><tspan x="556" dy="0">Limit</tspan></text>
<text x="556" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#525252"><tspan x="556" dy="0">Hourly caps and</tspan><tspan x="556" dy="19">quiet hours</tspan><tspan x="556" dy="19">apply.</tspan></text>
<path d="M690 96.5 H704" stroke="#a3a3a3" stroke-width="1.5"/><path d="M700 92.5 L706 96.5 L700 100.5" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="712" y="24" width="144" height="145" rx="10" fill="#171717"/>
<text x="728" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#fafafa" opacity="0.6">05</text>
<text x="728" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fafafa" font-weight="600"><tspan x="728" dy="0">Deliver</tspan></text>
<text x="728" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#fafafa" opacity="0.8"><tspan x="728" dy="0">Web push,</tspan><tspan x="728" dy="19">socket, email or</tspan><tspan x="728" dy="19">webhook.</tspan></text>

<text x="24" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a3a3a3"><tspan x="24" dy="0">A dead push endpoint (410 Gone) is removed, never retried. Notification bodies are never logged.</tspan></text>
</svg>
